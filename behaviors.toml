[presets.cell_competition]
description = "Shell-nucleus cells competing for food"
matrix = [
  #red,   blue,  green, yellow
  [4.0, 13.0, 10.0, 2.0],  # red    (A nucleus)
  [0.0, 4.0, 1.0, 0.0],    # blue   (A shell)
  [-2.0, -2.0, 2.0, -2.0], # green  (food)
  [2.0, 0.0, 10.0, 4.0],   # yellow (B nucleus)
]
